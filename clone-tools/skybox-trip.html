<!doctype html>
<html lang="en-CA" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip detail — Skybox Global</title>
<link rel="icon" href="/skybox-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/_ext/js.skyscnr.com/sttc/hamilton/falcon/static/css/bpk-styles.5b069319.css">
<style>
  body { margin:0; background:#f4f5f6; color:#05203c; font-family:"Skyscanner Relative",-apple-system,sans-serif; }
  .top { background:#05203c; color:#fff; padding:18px 24px; display:flex; gap:16px; align-items:center; }
  .brand { color:#fff; font-weight:900; font-size:22px; text-decoration:none; display:inline-flex; gap:8px; align-items:center; }
  .mark { display:inline-block; width:22px; height:22px; background:#fff; -webkit-mask:radial-gradient(circle at 50% 100%,#000 9px,transparent 10px) no-repeat,conic-gradient(from 200deg at 50% 100%,#000 0 140deg,transparent 0) no-repeat; mask:radial-gradient(circle at 50% 100%,#000 9px,transparent 10px) no-repeat,conic-gradient(from 200deg at 50% 100%,#000 0 140deg,transparent 0) no-repeat; }
  .wrap { max-width:980px; margin:0 auto; padding:24px; }
  .card { background:#fff; border-radius:8px; padding:20px 24px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:16px; }
  .pill { display:inline-block; background:#eef1f5; color:#05203c; border-radius:12px; padding:3px 10px; font-size:12px; font-weight:700; margin-left:6px; }
  .pill.cancelled { background:#fdecea; color:#5f2120; }
  .pill.confirmed { background:#e2f5ea; color:#1d6b3b; }
  .btn { display:inline-block; padding:10px 18px; border-radius:24px; background:#0062e3; color:#fff; font-weight:700; text-decoration:none; font-size:14px; border:0; cursor:pointer; }
  .btn.ghost { background:transparent; color:#0062e3; border:1px solid #dadce0; }
  .btn.danger { background:#c0392b; }
  .meta { color:#545860; font-size:14px; }
</style>
</head>
<body>
<header class="top"><a class="brand" href="/"><span class="mark"></span>Skybox Global</a></header>
<main class="wrap">
  <div style="margin-bottom:12px;font-size:13px"><a href="/trips" style="color:#0062e3;text-decoration:none">← My trips</a></div>
  <div id="container">Loading…</div>
</main>
<script>
(function () {
  const id = location.pathname.split('/').pop();
  function render(o) {
    const slices = (o.slices || []).map((s) => `<div style="padding:8px 0;border-bottom:1px solid #eef0f3"><div style="font-weight:700">${s.origin.iata} → ${s.destination.iata}</div>${s.segments.map((seg) => `<div class="meta">${seg.flight_number || ''} · ${new Date(seg.departing_at).toLocaleString()} → ${new Date(seg.arriving_at).toLocaleString()}</div>`).join('')}</div>`).join('');
    const isCancelled = o.status === 'cancelled';
    return `
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:24px;font-weight:800;letter-spacing:1px">${o.booking_reference}</div><div class="meta">${o.duffel_order_id}<span class="pill ${o.status}">${o.status}</span></div></div><div style="text-align:right"><div style="font-size:22px;font-weight:800">${o.total_amount} ${o.currency}</div><div class="meta">${o.contact.email}</div></div></div></div>
      <div class="card"><h2 style="margin:0 0 12px;font-size:18px">Itinerary</h2>${slices || '<div class="meta">No segments.</div>'}</div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap">${isCancelled ? '<div class="meta">This trip is cancelled.</div>' : '<button class="btn danger" id="cancelBtn">Cancel booking</button>'}<a class="btn ghost" href="/trips">Back to trips</a></div>`;
  }
  fetch('/skybox-api/orders/' + encodeURIComponent(id)).then((r) => r.json().then((j) => ({ ok: r.ok, j }))).then(({ ok, j }) => {
    if (!ok || j.error) { document.querySelector('#container').innerHTML = '<div class="card">' + (j.error?.message || 'Cannot load order.') + '</div>'; return; }
    document.querySelector('#container').innerHTML = render(j);
    const cancelBtn = document.getElementById('cancelBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', async () => {
      if (!confirm('Cancel this booking? Refund per fare rules.')) return;
      cancelBtn.disabled = true; cancelBtn.textContent = 'Cancelling…';
      const r = await fetch('/skybox-api/orders/' + encodeURIComponent(id) + '/cancel', { method:'POST' });
      const x = await r.json();
      if (!r.ok || x.error) { alert(x.error?.message || 'cancel failed'); cancelBtn.disabled = false; cancelBtn.textContent = 'Cancel booking'; return; }
      alert('Cancelled. Refund: ' + (x.refund_amount ? (x.refund_amount + ' ' + x.refund_currency) : 'none'));
      location.reload();
    });
  });
})();
</script>
</body>
</html>
