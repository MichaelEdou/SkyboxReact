<!doctype html>
<html lang="en-CA" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight search — Skybox Global</title>
<link rel="icon" href="/skybox-icon.svg" type="image/svg+xml">
<link rel="manifest" href="/android-chrome-manifest.json">
<link rel="stylesheet" href="/_ext/js.skyscnr.com/sttc/hamilton/falcon/static/css/bpk-styles.5b069319.css">
<link rel="stylesheet" href="/_ext/js.skyscnr.com/sttc/banana/static/css/bpk-styles.00b4170a.chunk.css">
<style>
  :root { --bg:#f4f5f6; --card:#fff; --ink:#05203c; --soft:#545860; --accent:#0062e3; --border:#dadce0; --shadow:0 1px 3px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04); }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Skyscanner Relative",-apple-system,sans-serif; }
  .top { background:var(--ink); color:#fff; padding:18px 24px; display:flex; align-items:center; gap:24px; }
  .brand { font-weight:900; font-size:22px; color:#fff; text-decoration:none; display:inline-flex; gap:8px; align-items:center; }
  .mark { display:inline-block; width:22px; height:22px; background:#fff; -webkit-mask:radial-gradient(circle at 50% 100%,#000 9px,transparent 10px) no-repeat,conic-gradient(from 200deg at 50% 100%,#000 0 140deg,transparent 0) no-repeat; mask:radial-gradient(circle at 50% 100%,#000 9px,transparent 10px) no-repeat,conic-gradient(from 200deg at 50% 100%,#000 0 140deg,transparent 0) no-repeat; }
  .wrap { max-width:1240px; margin:0 auto; padding:24px; }
  .summary { background:var(--card); border-radius:8px; padding:16px 20px; box-shadow:var(--shadow); display:flex; gap:16px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
  .summary .route { font-size:24px; font-weight:700; }
  .summary .meta { color:var(--soft); font-size:14px; }
  .summary .actions { margin-left:auto; }
  .btn { display:inline-block; padding:10px 18px; border:0; border-radius:24px; background:var(--accent); color:#fff; font-weight:700; font-size:14px; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--border); }
  .grid { display:grid; grid-template-columns:280px 1fr; gap:24px; align-items:flex-start; }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
  .filters { background:var(--card); border-radius:8px; padding:18px; box-shadow:var(--shadow); position:sticky; top:16px; }
  .filters h3 { margin:0 0 12px; font-size:14px; color:var(--soft); text-transform:uppercase; letter-spacing:.5px; }
  .filter-row { font-size:14px; padding:6px 0; display:flex; justify-content:space-between; align-items:center; }
  .card { background:var(--card); border-radius:8px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; }
  .legs { display:flex; flex-direction:column; gap:14px; }
  .leg { display:grid; grid-template-columns:48px 1fr; gap:14px; align-items:center; }
  .logo { width:32px; height:32px; border-radius:6px; background:#eef1f5; display:inline-flex; align-items:center; justify-content:center; overflow:hidden; }
  .logo img { max-width:100%; max-height:100%; }
  .row { display:flex; gap:12px; align-items:baseline; }
  .row .time { font-weight:700; font-size:18px; }
  .row .iata { color:var(--soft); font-size:13px; }
  .row .dur { color:var(--soft); font-size:13px; margin-left:auto; }
  .price { text-align:right; }
  .price .amount { font-size:24px; font-weight:800; }
  .price .per-pax { color:var(--soft); font-size:12px; }
  .empty, .loading { padding:60px; text-align:center; color:var(--soft); background:var(--card); border-radius:8px; }
  .pill { display:inline-block; background:#eef1f5; color:var(--ink); border-radius:12px; padding:2px 10px; font-size:12px; font-weight:600; }
  .toast { padding:12px 14px; border-radius:6px; margin-bottom:12px; font-size:14px; background:#fdecea; color:#5f2120; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--soft); border-top-color:transparent; border-radius:50%; animation: spin 1s linear infinite; vertical-align:-3px; margin-right:6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="mark"></span>Skybox Global</a>
</header>
<main class="wrap">
  <section class="summary">
    <div>
      <div class="route" id="route">…</div>
      <div class="meta" id="when">Loading…</div>
    </div>
    <div class="actions"><a class="btn ghost" href="/flights">Edit search</a></div>
  </section>
  <div class="grid">
    <aside class="filters" id="filters">
      <h3>Filters</h3>
      <div class="filter-row"><span>Airlines</span><span id="filter-airlines">—</span></div>
      <div class="filter-row"><span>Currency</span><span id="filter-currency">—</span></div>
      <div class="filter-row"><span>Live mode</span><span class="pill" id="filter-live">…</span></div>
    </aside>
    <section id="results">
      <div class="loading"><span class="spinner"></span>Searching flights with Duffel…</div>
    </section>
  </div>
</main>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const from = (qs.get('from') || '').toUpperCase();
  const to = (qs.get('to') || '').toUpperCase();
  const depart = qs.get('depart') || '';
  const ret = qs.get('ret') || '';
  const adults = parseInt(qs.get('adults') || '1', 10);
  const children = parseInt(qs.get('children') || '0', 10);
  const infants = parseInt(qs.get('infants') || '0', 10);
  const cabin = qs.get('cabin') || 'economy';
  const $ = (s) => document.querySelector(s);
  $('#route').textContent = (from && to) ? from + ' → ' + to : 'Flight search';
  const paxLabel = `${adults} adult${adults !== 1 ? 's' : ''}` + (children ? `, ${children} child${children !== 1 ? 'ren' : ''}` : '') + (infants ? `, ${infants} infant${infants !== 1 ? 's' : ''}` : '');
  $('#when').textContent = `${depart || '—'}${ret ? ' → ' + ret : ' · one-way'} · ${paxLabel} · ${cabin}`;
  if (!from || !to || !depart) { $('#results').innerHTML = '<div class="empty">Open <a href="/flights">Flights</a> and fill in origin, destination, and depart date.</div>'; return; }
  function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString('en-CA', { hour:'2-digit', minute:'2-digit' }) : ''; }
  function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString('en-CA', { weekday:'short', month:'short', day:'numeric' }) : ''; }
  function fmtDur(iso) { const m = /^P?T?(?:(\d+)H)?(?:(\d+)M)?/.exec(iso || ''); if (!m) return iso || ''; const h = m[1] ? +m[1] : 0, mn = m[2] ? +m[2] : 0; return (h ? h+'h ' : '') + (mn ? mn+'m' : ''); }
  function fmtPrice(a, c) { try { return new Intl.NumberFormat('en-CA', { style:'currency', currency:c, maximumFractionDigits:0 }).format(parseFloat(a)); } catch { return a + ' ' + c; } }
  function renderLeg(slice) {
    const segs = slice.segments;
    const first = segs[0], last = segs[segs.length - 1];
    const stops = segs.length - 1;
    const stopsLabel = stops === 0 ? 'Direct' : (stops + ' stop' + (stops > 1 ? 's' : ''));
    const carrier = first.marketing_carrier;
    const logo = carrier && carrier.logo ? `<img src="${carrier.logo}" alt="">` : `<span style="font-size:11px;font-weight:700;color:#666">${(carrier && carrier.iata) || '–'}</span>`;
    return `<div class="leg"><div class="logo">${logo}</div><div><div class="row"><span class="time">${fmtTime(first.departing_at)}</span><span class="iata">${slice.origin.iata}</span><span style="color:#a0a4ab">—</span><span class="time">${fmtTime(last.arriving_at)}</span><span class="iata">${slice.destination.iata}</span><span class="dur">${fmtDur(slice.duration)} · ${stopsLabel}</span></div><div class="row" style="margin-top:2px;color:#545860;font-size:13px"><span>${fmtDate(first.departing_at)}</span><span>${carrier && carrier.name ? carrier.name : ''}${carrier && carrier.iata ? ' · '+carrier.iata : ''}${first.flight_number ? first.flight_number : ''}</span></div></div></div>`;
  }
  function renderOffer(o) { return `<div class="card"><div class="legs">${o.slices.map(renderLeg).join('')}</div><div class="price"><div class="amount">${fmtPrice(o.total_amount, o.total_currency)}</div><div class="per-pax">total · ${o.passengers.length} pax</div><a class="btn" href="/flights/offer/${encodeURIComponent(o.id)}">Select</a></div></div>`; }
  fetch('/skybox-api/flights/search', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ from, to, depart, ret: ret || undefined, pax: { adults, children, infants }, cabin }) })
    .then((r) => r.json().then((j) => ({ ok: r.ok, j })))
    .then(({ ok, j }) => {
      if (!ok || j.error) { $('#results').innerHTML = `<div class="toast"><b>Duffel error.</b> ${j.error ? (j.error.message || j.error.code) : 'Request failed.'}</div>`; return; }
      if (!j.offers || !j.offers.length) { $('#results').innerHTML = '<div class="empty">No offers returned for this route on this date.</div>'; return; }
      const airlines = Array.from(new Set(j.offers.flatMap((o) => o.slices.flatMap((s) => s.segments.map((g) => g.marketing_carrier?.iata))).filter(Boolean)));
      $('#filter-airlines').textContent = airlines.slice(0, 6).join(', ') + (airlines.length > 6 ? '…' : '');
      $('#filter-currency').textContent = j.offers[0].total_currency;
      $('#filter-live').textContent = j.live_mode ? 'LIVE' : 'test';
      $('#filter-live').style.background = j.live_mode ? '#fdecea' : '#e3f1ff';
      $('#filter-live').style.color = j.live_mode ? '#5f2120' : '#0062e3';
      const sorted = j.offers.slice().sort((a, b) => parseFloat(a.total_amount) - parseFloat(b.total_amount));
      $('#results').innerHTML = sorted.map(renderOffer).join('');
    })
    .catch((e) => { $('#results').innerHTML = `<div class="toast"><b>Network error.</b> ${e.message}</div>`; });
})();
</script>
</body>
</html>
